# Biot's coefficient according to TSX
biot_coefficient: 0.2

# azimuth of max. horizontal stress [degrees]
init_stress_azimuth: 123 # original 200-117 = 83
# maximal horizontal stress [Pa]
init_stress_H: 42e6
# minimal horizontal stress [Pa]
init_stress_h: 19e6
# vertical stress [Pa]
init_stress_v: 14e6
# initial water pressure height [m]
init_pressure: 40

#storativity is computed from compressibilities and porosity
porosity: 0.007
water_compressibility: 5.1e-10
water_density: 1000

perm_k0: 3e-20
perm_eps: 33
perm_delta: 1e-16
perm_gamma: 6
perm_sigma_c: 55e6
conductivity_a: 0
conductivity_b: 0
conductivity_c: 0

young_modulus: 30e9
poisson_ratio: 0.24


flow_solver__a_tol: 0
flow_solver__r_tol: 1e-12
flow_solver__options: -ksp_type cg -pc_type hypre -pc_hypre_type boomeramg

mechanics_solver__a_tol: 0
mechanics_solver__r_tol: 1e-12
mechanics_solver__options: -ksp_type cg -pc_type hypre -pc_hypre_type boomeramg
